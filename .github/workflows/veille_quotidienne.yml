name: Veille emploi quotidienne

on:
  schedule:
    # 8h UTC = 9h CET (hiver) / 10h CEST (été) — lun à ven
    - cron: '0 8 * * 1-5'
  workflow_dispatch:  # permet un déclenchement manuel depuis l'UI GitHub

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # nécessaire pour pusher le rapport vers GitHub Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r veille_agent/requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
          FROM_EMAIL:        ${{ secrets.FROM_EMAIL }}
          REPORT_DIR:        /tmp/veille_jobs
          JOBS_DB:           ${{ github.workspace }}/docs/jobs.json
        run: python veille_agent/agent.py

      - name: Publier rapport sur GitHub Pages
        if: success()
        continue-on-error: true  # ne pas faire échouer le workflow si Pages plante
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          cp /tmp/veille_jobs/latest.html docs/index.html
          cp /tmp/veille_jobs/latest.html docs/latest.html
          DATE=$(date +%Y%m%d)
          cp /tmp/veille_jobs/latest.html docs/rapport_${DATE}.html
          [ -f /tmp/veille_jobs/sante.html ] && cp /tmp/veille_jobs/sante.html docs/sante.html || true
          [ -f /tmp/veille_jobs/jobs.json ] && cp /tmp/veille_jobs/jobs.json docs/jobs.json || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add docs/
          git commit -m "chore: rapport veille ${DATE}" || echo "Rien à committer"
          git push origin HEAD:main || echo "Push échoué — rapport non publié sur Pages"
